name: Build and Push to ECR

on:
  push:
    branches:
      - main
 
env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 381112450421.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - user-service
          - order-service
          - inventory-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }} ./${{ matrix.service }}

      - name: Tag Docker image
        run: |
          docker tag ${{ matrix.service }}:latest \
          $ECR_REGISTRY/${{ matrix.service }}:${{ env.IMAGE_TAG }}

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/${{ matrix.service }}:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes deployment file
        run: |
          sed -i "s|image: .*${{ matrix.service }}.*|image: $ECR_REGISTRY/${{ matrix.service }}:${{ env.IMAGE_TAG }}|g" \
          k8s/${{ matrix.service }}/deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "github-actions"
          git add k8s/${{ matrix.service }}/deployment.yaml
          git commit -m "Update ${{ matrix.service }} image to $IMAGE_TAG" || echo "No changes"
          git push
