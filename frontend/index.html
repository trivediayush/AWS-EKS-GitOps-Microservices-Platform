<!DOCTYPE html>
<html>
<head>
    <title>Microservices Demo</title>
</head>
<body>
    <h1>Microservices Dashboard</h1>

    <h2>Users</h2>
    <input type="text" id="username" placeholder="Name">
    <input type="text" id="useremail" placeholder="Email">
    <button onclick="createUser()">Add User</button>
    <ul id="usersList"></ul>

    <h2>Orders</h2>
    <input type="text" id="orderItem" placeholder="Item">
    <input type="number" id="orderQty" placeholder="Quantity">
    <button onclick="createOrder()">Create Order</button>
    <ul id="ordersList"></ul>

    <h2>Inventory</h2>
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="itemStock" placeholder="Stock">
    <button onclick="addItem()">Add Item</button>
    <ul id="itemsList"></ul>

<script>
const API_BASE = "http://localhost"; // update with EKS ALB later

async function fetchUsers() {
    const res = await fetch(`${API_BASE}:5000/users`);
    const data = await res.json();
    document.getElementById("usersList").innerHTML = data.map(u => `<li>${u.name} (${u.email})</li>`).join('');
}

async function createUser() {
    const name = document.getElementById("username").value;
    const email = document.getElementById("useremail").value;
    await fetch(`${API_BASE}:5000/users`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name, email})
    });
    fetchUsers();
}

async function fetchOrders() {
    const res = await fetch(`${API_BASE}:3000/orders`);
    const data = await res.json();
    document.getElementById("ordersList").innerHTML = data.map(o => `<li>${o.item} (${o.quantity})</li>`).join('');
}

async function createOrder() {
    const item = document.getElementById("orderItem").value;
    const quantity = parseInt(document.getElementById("orderQty").value);
    await fetch(`${API_BASE}:3000/orders`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({item, quantity})
    });
    fetchOrders();
}

async function fetchItems() {
    const res = await fetch(`${API_BASE}:4000/items`);
    const data = await res.json();
    document.getElementById("itemsList").innerHTML = data.map(i => `<li>${i.name} (${i.stock})</li>`).join('');
}

async function addItem() {
    const name = document.getElementById("itemName").value;
    const stock = parseInt(document.getElementById("itemStock").value);
    await fetch(`${API_BASE}:4000/items/add`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name, stock})
    });
    fetchItems();
}

// Initial load
fetchUsers();
fetchOrders();
fetchItems();
</script>
</body>
</html>
